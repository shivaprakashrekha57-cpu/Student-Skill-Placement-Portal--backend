spring.application.name=student-skill-placement-portal
server.port=${PORT:8080}
# Database: embedded H2 by default (no setup needed on Render), or MySQL when DB_URL is provided
spring.datasource.url=${DB_URL:jdbc:h2:mem:student_placement_portal;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
